name: Deploy Snowflake Retail Analytics DEV

on:
  workflow_dispatch:

jobs:
  deploy-dev:

    runs-on: ubuntu-latest

    env:
      SF_SKIP_TOKEN_FILE_PERMISSIONS_VERIFICATION: true

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: |
          pip install snowflake-cli

      - name: Create Private Key
        run: |
          mkdir -p ~/.snowflake

          printf "%s" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8

          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Verify Private Key
        run: |
          head -1 ~/.snowflake/rsa_key.p8
          tail -1 ~/.snowflake/rsa_key.p8

      - name: Create Snowflake Config
        run: |
          cat > ~/.snowflake/config.toml << EOF
          default_connection_name = "default"

          [connections.default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/home/runner/.snowflake/rsa_key.p8"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.SNOWFLAKE_DATABASE }}"
          EOF

          chmod 600 ~/.snowflake/config.toml

      - name: Test Snowflake Connection
        run: |
          snow sql -c default -q "
          SELECT
              CURRENT_USER(),
              CURRENT_ROLE(),
              CURRENT_WAREHOUSE(),
              CURRENT_DATABASE();
          "

      # Phase 01

      - name: Phase01 Environment
        run: snow sql -c default -f phase01_environment/01_environment_setup.sql

      # Phase 02

      - name: Phase02 Security
        run: snow sql -c default -f phase02_security/02_rbac_setup.sql

      # Phase 03

      - name: Phase03 File Formats
        run: snow sql -c default -f phase03_ingestion/03_file_formats.sql

      - name: Phase03 Stages
        run: snow sql -c default -f phase03_ingestion/04_stages.sql

      - name: Phase03 Raw Tables
        run: snow sql -c default -f phase03_ingestion/05_tables_raw.sql

      - name: Phase03 Copy Commands
        run: snow sql -c default -f phase03_ingestion/06_copy_commands.sql

      # Phase 04

      - name: Phase04 Data Quality
        run: snow sql -c default -f phase04_data_quality/07_data_quality_checks.sql

      # Phase 05

      - name: Phase05 Transformations
        run: snow sql -c default -f phase05_transformations/08_curated_layer.sql

      # Phase 06

      - name: Phase06 Dynamic Tables
        run: snow sql -c default -f phase06_dynamic_tables/09_dynamic_tables.sql

      # Phase 07

      - name: Phase07 Streams
        run: snow sql -c default -f phase07_streams/10_streams.sql

      # Phase 08

      - name: Phase08 Tasks
        run: snow sql -c default -f phase08_tasks/11_tasks.sql

      # Phase 09

      - name: Phase09 Semi Structured
        run: snow sql -c default -f phase09_semistructured/12_json_variant.sql

      # Phase 10

      - name: Phase10 Time Travel
        run: snow sql -c default -f phase10_time_travel/13_time_travel.sql

      # Phase 11

      - name: Phase11 Cloning
        run: snow sql -c default -f phase11_cloning/14_zero_copy_clone.sql

      # Phase 12

      - name: Phase12 Performance
        run: snow sql -c default -f phase12_performance/15_performance_tuning.sql

      # Phase 13

      - name: Phase13 External Tables
        run: snow sql -c default -f phase13_external_tables/16_external_tables.sql

      # Phase 14

      - name: Install Snowpark
        run: |
          pip install snowflake-snowpark-python

      - name: Execute Snowpark Script
        run: |
          python phase14_snowpark/snowpark_sales_analysis.py

      # Phase 15

      - name: Phase15 Data Sharing
        run: snow sql -c default -f phase15_data_sharing/17_data_sharing.sql

      # Phase 16

      - name: Phase16 Cortex AI
        run: snow sql -c default -f phase16_cortex_ai/18_cortex_ai.sql

      # Phase 17

      - name: Phase17 Monitoring
        run: snow sql -c default -f phase17_monitoring/19_monitoring.sql

      # Phase 18

      - name: Phase18 Cost Optimization
        run: snow sql -c default -f phase18_cost_optimization/20_resource_monitors.sql

      # Phase 19

      - name: Phase19 Governance
        run: snow sql -c default -f phase19_governance/21_governance.sql

      # Phase 20

      - name: Phase20 Analytics Views
        run: snow sql -c default -f phase20_capstone/22_analytics_views.sql

      - name: Deployment Complete
        run: |
          echo "Snowflake Retail Analytics deployment completed successfully"