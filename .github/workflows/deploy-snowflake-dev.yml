name: Deploy Snowflake Retail Analytics DEV

on:
  workflow_dispatch:

jobs:
  deploy-dev:

    runs-on: ubuntu-latest

    steps:

      #################################################
      # CHECKOUT
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # VALIDATE YAML FILES
      #################################################

      - name: Validate Workflow YAML Files
        run: |
          pip install pyyaml

          python << 'PY'
          import yaml
          import glob

          files = glob.glob(".github/workflows/*.yml")
          files.extend(glob.glob(".github/workflows/*.yaml"))

          for file in files:
              with open(file, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)

              print(f"SUCCESS: {file}")

          print("All workflow YAML files are valid")
          PY

      #################################################
      # VALIDATE REPOSITORY FILES
      #################################################

      - name: Validate Repository Structure
        run: |
          test -f phase01_environment/01_environment_setup.sql
          test -f phase02_security/02_rbac_setup.sql
          test -f phase03_ingestion/03_file_formats.sql
          test -f phase03_ingestion/04_stages.sql
          test -f phase03_ingestion/05_tables_raw.sql
          test -f phase03_ingestion/06_copy_commands.sql

          test -f data/customers.csv
          test -f data/products.csv
          test -f data/stores.csv
          test -f data/sales.csv

          test -f phase14_snowpark/snowpark_analytics.py

          echo "Repository validation successful"

      #################################################
      # DISPLAY FILE STRUCTURE
      #################################################

      - name: Show Repository Structure
        run: |
          pwd
          find . -type f | sort

      #################################################
      # PYTHON
      #################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #################################################
      # SNOWFLAKE CLI
      #################################################

      - name: Install Snowflake CLI
        run: |
          pip install snowflake-cli

      #################################################
      # JWT PRIVATE KEY
      #################################################

      - name: Create Private Key
        run: |
          mkdir -p ~/.snowflake

          printf "%s" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8

          chmod 600 ~/.snowflake/rsa_key.p8

      #################################################
      # SNOWFLAKE CONFIG
      #################################################

      - name: Create Snowflake Config
        run: |
          cat > ~/.snowflake/config.toml << EOF
          default_connection_name="default"

          [connections.default]
          account="${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user="${{ secrets.SNOWFLAKE_USER }}"
          authenticator="SNOWFLAKE_JWT"
          private_key_file="/home/runner/.snowflake/rsa_key.p8"
          role="${{ secrets.SNOWFLAKE_ROLE }}"
          warehouse="${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database="${{ secrets.SNOWFLAKE_DATABASE }}"
          EOF

          chmod 600 ~/.snowflake/config.toml

      #################################################
      # TEST CONNECTION
      #################################################

      - name: Test Snowflake Connection
        run: |
          snow sql -c default -q "
          SELECT CURRENT_USER(),
                 CURRENT_ROLE(),
                 CURRENT_WAREHOUSE(),
                 CURRENT_DATABASE();
          "

      #################################################
      # PHASE 01
      #################################################

      - name: Phase01 Environment
        run: |
          snow sql -c default -f phase01_environment/01_environment_setup.sql

      #################################################
      # PHASE 02
      #################################################

      - name: Phase02 Security
        run: |
          snow sql -c default -f phase02_security/02_rbac_setup.sql

      #################################################
      # PHASE 03
      #################################################

      - name: Phase03 File Formats
        run: |
          snow sql -c default -f phase03_ingestion/03_file_formats.sql

      - name: Phase03 Stages
        run: |
          snow sql -c default -f phase03_ingestion/04_stages.sql

      - name: Phase03 Raw Tables
        run: |
          snow sql -c default -f phase03_ingestion/05_tables_raw.sql

      - name: Clean Stages
        run: |
          snow sql -c default -q "REMOVE @RETAIL_DB.STAGE.CUSTOMERS_STAGE;"
          snow sql -c default -q "REMOVE @RETAIL_DB.STAGE.PRODUCTS_STAGE;"
          snow sql -c default -q "REMOVE @RETAIL_DB.STAGE.STORES_STAGE;"
          snow sql -c default -q "REMOVE @RETAIL_DB.STAGE.SALES_STAGE;"

      - name: Verify CSV Files
        run: |
          cat data/customers.csv
          cat data/products.csv
          cat data/stores.csv
          cat data/sales.csv

      - name: Upload CSV Files
        run: |
          snow stage copy data/customers.csv @RETAIL_DB.STAGE.CUSTOMERS_STAGE -c default --overwrite
          snow stage copy data/products.csv @RETAIL_DB.STAGE.PRODUCTS_STAGE -c default --overwrite
          snow stage copy data/stores.csv @RETAIL_DB.STAGE.STORES_STAGE -c default --overwrite
          snow stage copy data/sales.csv @RETAIL_DB.STAGE.SALES_STAGE -c default --overwrite

      - name: Phase03 Copy Commands
        run: |
          snow sql -c default -f phase03_ingestion/06_copy_commands.sql

      #################################################
      # PHASE 04
      #################################################

      - name: Phase04 Data Quality
        run: |
          snow sql -c default -f phase04_data_quality/07_data_quality_checks.sql

      #################################################
      # PHASE 05
      #################################################

      - name: Phase05 Curated Layer
        run: |
          snow sql -c default -f phase05_transformations/08_curated_layer.sql

      #################################################
      # PHASE 06
      #################################################

      - name: Phase06 Dynamic Tables
        run: |
          snow sql -c default -f phase06_dynamic_tables/09_dynamic_tables.sql

      #################################################
      # PHASE 07
      #################################################

      - name: Phase07 Streams
        run: |
          snow sql -c default -f phase07_streams/10_streams.sql

      #################################################
      # PHASE 08
      #################################################

      - name: Phase08 Tasks
        run: |
          snow sql -c default -f phase08_tasks/11_tasks.sql

      #################################################
      # PHASE 09
      #################################################

      - name: Phase09 Semi Structured Data
        run: |
          snow sql -c default -f phase09_semistructured/12_json_variant.sql

      #################################################
      # PHASE 10
      #################################################

      - name: Phase10 Time Travel
        run: |
          snow sql -c default -f phase10_time_travel/13_time_travel.sql

      #################################################
      # PHASE 11
      #################################################

      - name: Phase11 Zero Copy Clone
        run: |
          snow sql -c default -f phase11_cloning/14_zero_copy_clone.sql

      #################################################
      # PHASE 12
      #################################################

      - name: Phase12 Performance Tuning
        run: |
          snow sql -c default -f phase12_performance/15_performance_tuning.sql

            #################################################
      # PHASE 13
      #################################################

      - name: Phase13 External Tables
        run: |
          snow sql -c default \
          -f phase13_external_tables/16_external_tables.sql

      #################################################
      # PHASE 14 - SNOWPARK ANALYTICS
      #################################################

      - name: Install Snowpark
        run: |
          pip install snowflake-snowpark-python

      - name: Execute Snowpark Analytics
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_FILE: /home/runner/.snowflake/rsa_key.p8
        run: |
          python phase14_snowpark/snowpark_analytics.py

      - name: Validate Product Summary
        run: |
          snow sql -c default -q "
          SELECT COUNT(*) AS PRODUCT_ROWS
          FROM RETAIL_DB.CURATED.PRODUCT_SALES_SUMMARY;
          "

      - name: Validate Customer Summary
        run: |
          snow sql -c default -q "
          SELECT COUNT(*) AS CUSTOMER_ROWS
          FROM RETAIL_DB.CURATED.CUSTOMER_REVENUE_SUMMARY;
          "

      - name: Validate Store Summary
        run: |
          snow sql -c default -q "
          SELECT COUNT(*) AS STORE_ROWS
          FROM RETAIL_DB.CURATED.STORE_REVENUE_SUMMARY;
          "

      - name: Validate Daily Revenue
        run: |
          snow sql -c default -q "
          SELECT COUNT(*) AS DAILY_ROWS
          FROM RETAIL_DB.CURATED.DAILY_REVENUE;
          "

      #################################################
      # PHASE 15
      #################################################

      - name: Phase15 Data Sharing
        run: |
          snow sql -c default \
          -f phase15_data_sharing/17_data_sharing.sql

      #################################################
      # PHASE 16
      #################################################

      - name: Phase16 Cortex AI
        run: |
          snow sql -c default \
          -f phase16_cortex_ai/18_cortex_ai.sql

      #################################################
      # PHASE 17
      #################################################

      - name: Phase17 Monitoring
        run: |
          snow sql -c default \
          -f phase17_monitoring/19_monitoring.sql

      #################################################
      # PHASE 18
      #################################################

      - name: Phase18 Resource Monitors
        run: |
          snow sql -c default \
          -f phase18_cost_optimization/20_resource_monitors.sql

      #################################################
      # PHASE 19
      #################################################

      - name: Phase19 Governance
        run: |
          snow sql -c default \
          -f phase19_governance/21_governance.sql

      #################################################
      # PHASE 20
      #################################################

      - name: Phase20 Analytics Views
        run: |
          snow sql -c default \
          -f phase20_capstone/22_analytics_views.sql

      #################################################
      # FINAL VALIDATION
      #################################################

      - name: Validate Deployment
        run: |
          snow sql -c default -q "SHOW DATABASES;"
          snow sql -c default -q "SHOW SCHEMAS IN DATABASE RETAIL_DB;"
          snow sql -c default -q "SHOW TABLES IN SCHEMA RETAIL_DB.RAW;"
          snow sql -c default -q "SHOW TABLES IN SCHEMA RETAIL_DB.CURATED;"
          snow sql -c default -q "SHOW VIEWS IN SCHEMA RETAIL_DB.ANALYTICS;"

      - name: Deployment Complete
        run: |
          echo "Snowflake Retail Analytics deployment completed successfully"
